<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <title>Jazz Design - TXT BOOKS</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <link rel="stylesheet" href="https://use.typekit.net/syu5ypu.css">
    <script src="/script.js" defer></script>
</head>
<style>
    body {
        font-family: 'Monument Grotesk Regular'; 
        color: #0009b8;
        padding-left: 20%;
        padding-right: 20%;
        margin-top: 80px;
    }

    a {
        color: #0009b8;
        font-family: 'Monument Grotesk Regular'; 
        text-decoration: none;
    }

    .parent {
        display: grid;
        width: 100px;
        position: relative;
        grid-template-columns: repeat(3);
        grid-template-rows: 1fr;
        grid-column-gap: 15px;
        grid-row-gap: 0px;
        }
        
    .butterfly { grid-area: 1 / 1 / 2 / 2; }
    .butterfly img { width: 300px; }
    .judy { grid-area: 1 / 2 / 2 / 3; }
    .judy img { width: 300px }
    .simon { grid-area: 1 / 3 / 2 / 4; }
    .simon img { width: 300px }
    
</style>


<h1>
    Poster for TXTbook's talk 
</h1>

<div class="parent">
<div class="butterfly">
    <a href="https://www.margauxbigou.shopping/product/jeremiades" target="_blank"> 
        <img src="/section_design/TXTbooks/butterfly.jpg">
        <h3>Jérémiades – Margaux Bigou </h3>
    </a>
</div>

<div class="judy">
    <a href="https://www.txtbooks.us/product/anecdotes-judy-chung/" target="_blank">
        <img src="/section_design/TXTbooks/judy.jpg">
        <h3>Anecdotes – Judy Chung</h3>
    </a>
</div>

<div class="simon">
    <a href="https://www.txtbooks.us/product/bear-mixtape-simon-ramirez/" target="_blank">
        <img src="/section_design/TXTbooks/simon.jpg">
        <h3>Bear Mixtape Vol. 1 – Simón Ramirez</h3>
    </a>
</div>
</div>
